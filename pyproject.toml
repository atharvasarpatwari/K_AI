[project]
name = "keerthi-ai"
version = "2.2.0"
description = "KEERTHI AI — conversational voice assistant for Windows with a simulated smart home."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = ["node_modules", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
files = ["keerthi", "main.py"]
exclude = ["node_modules"]
mypy_path = ["."]

# Optional STT packages: may be absent (CI) or present-but-untyped (runtime).
[[tool.mypy.overrides]]
module = ["vosk", "faster_whisper", "numpy"]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]
